name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
            pip-flags: "--pre"
            name: PRE-RELEASE DEPENDENCIES

    name: ${{ matrix.name || format('{0} / Python {1}', matrix.os, matrix.python) }}

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}
      PYTHONUTF8: "1"
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
      MPLBACKEND: agg

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Upgrade pip and wheel
        run: python -m pip install --upgrade pip wheel hatch-vcs

      - name: Install CPU PyTorch wheels
        run: |
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install embpy with dev+test extras
        run: |
          pip install ${{ matrix.pip-flags }} -e ".[dev,test]"

      - name: Smoke test
        run: |
          python -c "from embpy.embedder import BioEmbedder; e = BioEmbedder(device='cpu'); print(e.device, len(e.list_available_models()))"

      - name: Run test suite
        run: |
          coverage run -m pytest -v --color=yes

      - name: Report coverage
        run: |
          coverage report

      - name: Upload coverage
        uses: codecov/codecov-action@v3

