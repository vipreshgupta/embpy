site_name: embpy
site_description: Universal multi-modal embeddings for biological sequences, cells, and molecules.
site_url: https://embpy.readthedocs.io/
repo_url: https://github.com/theislab/embpy
repo_name: theislab/embpy

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Cross-Platform & Hardware: cross-platform.md
  - Architecture: technical.md
  - API Reference: api-reference.md
  - Advanced Guides:
      - Attention Extraction: attention_extraction.md
      - Static Embeddings: static_embeddings.md
      - Old API Docs: api.md
  - References: references.md
  - Changelog: changelog.md
  - Contributing: contributing.md
